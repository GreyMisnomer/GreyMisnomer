version: '3.8'

services:
  relay:
    build:
      context: ../..
      dockerfile: sovereign/relay/Dockerfile
    container_name: greymisnomer-relay
    restart: unless-stopped
    ports:
      - "9483:9483"
      - "127.0.0.1:9482:9482"
    environment:
      - GM_DATA_DIR=/data
      - GM_P2P_PORT=9483
      - GM_RPC_PORT=9482
      - GM_RELAY=true
    volumes:
      - relay_data:/data

volumes:
  relay_data:
