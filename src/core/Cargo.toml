[package]
# The name of our crate (library)
name = "grey-misnomer-core"
# The initial semantic version
version = "0.1.0"
# We are using the 2021 edition of Rust, which has the latest features
edition = "2021"
license = "MIT"

[dependencies]
# Serde is the standard framework in Rust for serializing and deserializing data structures (e.g., to JSON)
serde = { version = "1.0", features = ["derive"] }
# thiserror helps us easily define custom error types (used in error.rs)
thiserror = "2.0"
# anyhow provides a flexible Error type for easy error handling when we don't need a specific type
anyhow = "1.0"
# blake3 is a very fast cryptographic hash function. We'll use it for our Merkle Trees (from RFC-003)
# explicitly pinned to 1.5.5 to avoid compiling errors on older Rust setups
blake3 = "=1.5.5"
# serde_json for human-readable output in the CLI demo
serde_json = "1.0"
# ed25519-dalek for RFC-005 strict digital signatures and cryptographic authorization
ed25519-dalek = { version = "2.1", default-features = false, features = ["alloc", "serde"] }
# hex for canonical lowercase hexadecimal pubkey and signature serialization
hex = "0.4"

[[example]]
name = "demo"
path = "examples/demo.rs"
