services:
  node:
    build:
      context: .
      dockerfile: Dockerfile
    image: greymisnomer/node:latest
    container_name: greymisnomer-node
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/events.jsonl"]
      interval: 30s
      timeout: 5s
      retries: 3
