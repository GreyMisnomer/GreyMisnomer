name: Release Pre-Built Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.3.0)'
        required: false
        default: 'v0.3.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: grey-misnomer-cli
            archive_ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: grey-misnomer-cli
            archive_ext: tar.gz
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-13
            bin_name: grey-misnomer-cli
            archive_ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            bin_name: grey-misnomer-cli
            archive_ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_name: grey-misnomer-cli.exe
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross (Linux aarch64)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build CLI Binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p grey-misnomer-cli
          else
            cargo build --release --target ${{ matrix.target }} -p grey-misnomer-cli
          fi
        shell: bash

      - name: Package Binary Archive
        id: package
        shell: bash
        run: |
          STAGING="grey-misnomer-cli-${{ matrix.target }}"
          mkdir -p "$STAGING"

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/grey-misnomer-cli.exe" "$STAGING/"
            cp README.md LICENSE "$STAGING/"
            7z a "$STAGING.zip" "$STAGING"
            echo "archive=$STAGING.zip" >> $GITHUB_OUTPUT
          else
            cp "target/${{ matrix.target }}/release/grey-misnomer-cli" "$STAGING/"
            cp README.md LICENSE "$STAGING/"
            tar -czvf "$STAGING.tar.gz" "$STAGING"
            echo "archive=$STAGING.tar.gz" >> $GITHUB_OUTPUT
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: grey-misnomer-cli-${{ matrix.target }}.*

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare Assets & Compute SHA256 Checksums
        id: checksums
        run: |
          mkdir -p release_assets
          find dist -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release_assets/ \;
          cd release_assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Sign Checksums with GPG (if secret provided)
        id: gpg-sign
        env:
          GPG_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_KEY" ]; then
            echo "$GPG_KEY" | gpg --batch --import
            echo "$GPG_PASSPHRASE" | gpg --batch --yes --passphrase-fd 0 --armor --detach-sign release_assets/SHA256SUMS.txt
            echo "GPG signature SHA256SUMS.txt.asc generated."
          else
            echo "No GPG_SIGNING_KEY configured; skipping release signature."
          fi

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
