name: Build WASM + Deploy GitHub Pages

on:
  push:
    branches: [main]

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ── Quality gates — nothing deploys unless all three pass ──────────
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all

      # ── Build WASM (only runs if quality gates passed) ─────────────────
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM package
        working-directory: src/wasm
        run: |
          wasm-pack build \
            --target web \
            --out-dir ../../docs/pkg \
            --out-name grey_misnomer_wasm \
            --release

      # wasm-pack writes a * gitignore inside pkg/ — we don't want that on CI
      - name: Override pkg/.gitignore so artifacts are served
        run: |
          printf '# Allow all — wasm-pack default overridden\n!*\n' > docs/pkg/.gitignore

      # ── Event Log Verification & OpenTimestamps Bitcoin Anchoring ───────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OpenTimestamps Client
        run: pip install opentimestamps-client

      - name: Verify Event Log Invariants & Checkpoints via CLI Replayer
        run: cargo run -p grey-misnomer-cli -- replay events.jsonl --checkpoints checkpoints

      - name: Anchor Event Log to Bitcoin via OpenTimestamps
        run: |
          if cargo run -p grey-misnomer-cli -- replay events.jsonl --require-ots >/dev/null 2>&1; then
            ots upgrade events.jsonl.ots || true
          else
            echo "events.jsonl.ots is missing or stale (SHA-256 mismatch); re-stamping..."
            rm -f events.jsonl.ots
            ots stamp events.jsonl
          fi

          if [ -d checkpoints ]; then
            for cp in checkpoints/*.json; do
              [ -f "$cp" ] || continue
              ots_file="${cp}.ots"
              MATCHES=$(python3 -c '
import hashlib, sys
cp_bytes = open(sys.argv[1], "rb").read()
ots_path = sys.argv[2]
try:
    ots = open(ots_path, "rb").read()
    print("1" if len(ots) >= 65 and ots[:31] == b"\x00OpenTimestamps\x00\x00Proof\x00\xbf\x89\xe2\xe8\x84\xe8\x92\x94" and ots[31] == 1 and ots[32] == 0x08 and ots[33:65] == hashlib.sha256(cp_bytes).digest() else "0")
except FileNotFoundError:
    print("0")
' "$cp" "$ots_file")
              if [ "$MATCHES" = "1" ]; then
                ots upgrade "$ots_file" || true
              else
                echo "${ots_file} is missing or stale; re-stamping..."
                rm -f "$ots_file"
                ots stamp "$cp"
              fi
            done
          fi

          # Ensure docs copy matches for GitHub Pages deployment
          cp events.jsonl docs/events.jsonl
          cp events.jsonl.ots docs/events.jsonl.ots
          if [ -d checkpoints ]; then
            mkdir -p docs/checkpoints
            cp -r checkpoints/. docs/checkpoints/
          fi
          ots info events.jsonl.ots

      - name: Blocking Gate — Strict OTS Digest & Replay Check Before Pages Deploy
        run: |
          cargo run -p grey-misnomer-cli -- replay events.jsonl --checkpoints checkpoints --require-ots
          cargo run -p grey-misnomer-cli -- replay docs/events.jsonl --checkpoints docs/checkpoints --require-ots

      - name: Publish Decentralized Multi-Mirrors (IPFS & Archive.org)
        run: |
          python3 scripts/publish_mirrors.py

      - name: Commit updated .ots proofs and multi-mirror manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.jsonl.ots docs/events.jsonl docs/events.jsonl.ots manifest.json docs/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: OpenTimestamps & multi-mirror manifest update [skip ci]"
            git push || echo "Push skipped or not permitted in this context"
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

