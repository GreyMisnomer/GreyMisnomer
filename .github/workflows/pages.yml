name: Build WASM + Deploy GitHub Pages

on:
  push:
    branches: [main]

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ── Quality gates — nothing deploys unless all three pass ──────────
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all

      # ── Build WASM (only runs if quality gates passed) ─────────────────
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM package
        working-directory: src/wasm
        run: |
          wasm-pack build \
            --target web \
            --out-dir ../../docs/pkg \
            --out-name grey_misnomer_wasm \
            --release

      # wasm-pack writes a * gitignore inside pkg/ — we don't want that on CI
      - name: Override pkg/.gitignore so artifacts are served
        run: |
          printf '# Allow all — wasm-pack default overridden\n!*\n' > docs/pkg/.gitignore

      # ── Event Log Verification & OpenTimestamps Bitcoin Anchoring ───────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OpenTimestamps Client
        run: pip install opentimestamps-client

      - name: Verify Event Log Invariants via CLI Replayer
        run: cargo run -p grey-misnomer-cli -- events.jsonl

      - name: Anchor Event Log to Bitcoin via OpenTimestamps
        run: |
          # If .ots proof exists, attempt to upgrade pending attestations; non-zero exit when still pending Bitcoin confirmations is expected
          if [ -f events.jsonl.ots ]; then
            ots upgrade events.jsonl.ots || true
          else
            ots stamp events.jsonl
          fi
          # Ensure docs copy matches for GitHub Pages deployment
          cp events.jsonl docs/events.jsonl
          cp events.jsonl.ots docs/events.jsonl.ots
          # Print proof info for workflow audit trail
          ots info events.jsonl.ots

      - name: Commit updated .ots proofs if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.jsonl.ots docs/events.jsonl docs/events.jsonl.ots
          if ! git diff --cached --quiet; then
            git commit -m "ci: OpenTimestamps Bitcoin anchoring update [skip ci]"
            git push || echo "Push skipped or not permitted in this context"
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

